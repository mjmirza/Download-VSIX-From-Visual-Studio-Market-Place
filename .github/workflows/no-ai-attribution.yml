name: no-ai-attribution

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Reject AI authors and attribution lines
        run: bash .github/scripts/no-ai-attribution.sh "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"
